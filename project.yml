name: WildOCR
options:
  bundleIdPrefix: com.chenyu9512
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.2.0'
    CURRENT_PROJECT_VERSION: '2'
targets:
  WildOCR:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: ios/WildOCRApp
        excludes:
          - Info.plist
      - path: Sources/WildOCRCore
      - path: Sources/WildOCRAppleVision
      - path: Sources/WildOCRPaddleBridge
    info:
      path: ios/WildOCRApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chenyu9512.wildocr
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: 'WILD_OCR_EMBEDDED'
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: 'NO'
